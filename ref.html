<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Android Master Web</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { padding: 12px; background: #1976d2; color: white; text-align: center; }
    #progress { display: none; text-align: center; padding: 10px; }

    .horizontal {
        display: flex;
        overflow-x: auto;
        gap: 10px;
        padding: 10px;
        background: #f5f5f5;
    }

    .chip {
        padding: 10px 14px;
        background: #e3f2fd;
        border-radius: 20px;
        cursor: pointer;
        white-space: nowrap;
        border: 1px solid #90caf9;
    }

    .chip:hover {
        background: #bbdefb;
    }

    .vertical {
        padding: 10px;
    }

    .item {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        cursor: pointer;
    }

    .item:hover {
        background: #f9f9f9;
    }

    /* Simple dialog */
    #dialogOverlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
    }

    #dialogBox {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: white;
        max-height: 70%;
        overflow-y: auto;
        border-radius: 16px 16px 0 0;
        padding: 10px;
    }

    .dialog-item {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        cursor: pointer;
    }
</style>
</head>
<body>

<header>Android Master Web</header>

<div id="progress">Loading...</div>

<div id="masterList" class="horizontal"></div>
<div id="detailList" class="vertical"></div>

<!-- Dialog -->
<div id="dialogOverlay" onclick="closeDialog()">
    <div id="dialogBox" onclick="event.stopPropagation()">
        <h3>Select a link</h3>
        <div id="dialogList"></div>
    </div>
</div>

<script>
const API_BASE = "http://v8m.b07.mytemp.website/app/apps/"; // change if needed
const DOMAIN = "http://v8m.b07.mytemp.website/app/apps/";

let PATH_CURRENT = "";
let PATH_TYPE = "";

// ---------- Helpers ----------

function showProgress(show) {
    document.getElementById("progress").style.display = show ? "block" : "none";
}

function urlProcess(url) {
    if (url.startsWith("http://") || url.startsWith("https://")) {
        return url;
    }
    return "http://" + url;
}

function buildSafeUrl(domain, path, fileName) {
    let encodedFileName = encodeURIComponent(fileName)
        .replace(/\+/g, "%20")
        .replace(/%28/g, "(")
        .replace(/%29/g, ")")
        .replace(/%2C/g, ",")
        .replace(/%26/g, "&")
        .replace(/%27/g, "'");

    return domain.replace(/\/$/, "") + "/" +
           path.replace(/^\/|\/$/g, "") + "/" +
           encodedFileName;
}

// ---------- API Calls ----------

async function loadMaster() {
    showProgress(true);
    try {
        const res = await fetch(API_BASE + "getmydata.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "get_master_skills" })
        });

        const json = await res.json();
        showProgress(false);

        if (json.status) {
            renderMaster(json.data);
        } else {
            alert(json.message || "Failed to load master");
        }
    } catch (e) {
        showProgress(false);
        alert(e.message);
    }
}

async function loadDetails(tag) {
    showProgress(true);
    try {
        const res = await fetch(API_BASE + "getmydata.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: tag })
        });

        const json = await res.json();
        showProgress(false);

        if (json.status) {
            renderDetails(json.data);
        } else {
            alert(json.message || "Failed to load details");
        }
    } catch (e) {
        showProgress(false);
        alert(e.message);
    }
}

// ---------- Render UI ----------

function renderMaster(list) {
    const container = document.getElementById("masterList");
    container.innerHTML = "";

    list.forEach(item => {
        const div = document.createElement("div");
        div.className = "chip";
        div.textContent = item.ms_name || item.name || "Item";
        div.onclick = () => {
            PATH_CURRENT = item.ms_folder || "";
            PATH_TYPE = item.ms_type || "";
            loadDetails(item.ms_tag || item.tag);
        };
        container.appendChild(div);
    });
}

function renderDetails(list) {
    const container = document.getElementById("detailList");
    container.innerHTML = "";

    list.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = item.name;

        div.onclick = () => {
            if (!item.links || item.links.length === 0) return;

            if (item.links.length === 1) {
                clickUrl(item.links[0]);
            } else {
                openDialog(item.links);
            }
        };

        container.appendChild(div);
    });
}

// ---------- Click Handling ----------

function clickUrl(url) {
    let finalUrl;
    if (PATH_TYPE === "pdf") {
        const prep = buildSafeUrl(DOMAIN, PATH_CURRENT, url);
        finalUrl = urlProcess(urlProcess(prep));
    } else {
        finalUrl = urlProcess(urlProcess(url));
    }
    window.open(finalUrl, "_blank");
}

// ---------- Dialog ----------

function openDialog(list) {
    const overlay = document.getElementById("dialogOverlay");
    const dialogList = document.getElementById("dialogList");
    dialogList.innerHTML = "";

    list.forEach(link => {
        const div = document.createElement("div");
        div.className = "dialog-item";
        div.textContent = link;
        div.onclick = () => {
            closeDialog();
            clickUrl(link);
        };
        dialogList.appendChild(div);
    });

    overlay.style.display = "block";
}

function closeDialog() {
    document.getElementById("dialogOverlay").style.display = "none";
}

// ---------- Init ----------
loadMaster();
</script>

</body>
</html>
